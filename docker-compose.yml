services:
  db:
    image: pgvector/pgvector:pg17
    container_name: regrag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: regrag
      POSTGRES_USER: regrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bound to loopback: the API talks to this over the host, and the VPS
    # should not expose Postgres to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regrag -d regrag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
